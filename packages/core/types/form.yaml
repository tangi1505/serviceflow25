#
# A form (UI11; Inventar G130, G131; KF8; Hauptplan E133): sections with questions for one
# target type, as JSON the package forms checks. A question is bound to a field of the target
# type or free; the bound answers become the new record, the free ones its first timeline
# entry. Active forms are offered in the portal to whoever may create the target type.
name: form
label: {de: Formular, en: Form}
title_field: name
traits: [history]
fields:
  - name: name
    type: text
    label: {de: Name, en: Name}
    required: true
    searchable: true
    max_length: 150
  - name: description
    type: text
    label: {de: Beschreibung, en: Description}
    max_length: 2000
  - name: target_type
    type: text
    label: {de: Legt an, en: Creates}
    description: {de: "Typ mit Paket, etwa sd.incident", en: "Type with its package, e.g. sd.incident"}
    required: true
    max_length: 130
  - name: active
    type: boolean
    label: {de: Im Portal angeboten, en: Offered in the portal}
    default: false
  - name: definition
    type: text
    label: {de: Aufbau, en: Structure}
    description: {de: "Abschnitte und Fragen; im Formular-Baukasten bearbeitet", en: "Sections and questions; edited in the form builder"}
    required: true
    max_length: 200000
