#
# A tile on the start page of the portal (SD14, SD-Plan E13; Inventar G78): what a user may do
# from there. It leads to creating a record of a type, a form, a reading area such as
# "Wissen", one record such as an article, or a link outside. Who sees it says "Sichtbar für",
# as at the article: everyone at the tile's node and below, or only the groups in the role
# "Gruppen". Packages bring tiles as start data; each tenant changes them.
name: portal_tile
label: {de: Kachel im Portal, en: Tile in the portal}
title_field: name
traits: [history, actors]
fields:
  - name: name
    type: text
    label: {de: Titel, en: Title}
    required: true
    translatable: true
    max_length: 80
  - name: description
    type: text
    label: {de: Text, en: Text}
    translatable: true
    max_length: 300
  - name: kind
    type: choice
    label: {de: Führt zu, en: Leads to}
    required: true
    default: create
    options:
      - {value: create, label: {de: Neuer Datensatz eines Typs, en: New record of a type}}
      - {value: form, label: {de: Formular, en: Form}}
      - {value: area, label: {de: Bereich, en: Area}}
      - {value: record, label: {de: Datensatz, en: Record}}
      - {value: link, label: {de: Link, en: Link}}
  - name: form
    type: reference
    label: {de: Formular, en: Form}
    to: core.form
  - name: target_type
    type: text
    label: {de: Typ, en: Type}
    description: {de: "Typ mit Paket, etwa incident.incident oder knowledge.article", en: "Type with its package, e.g. incident.incident or knowledge.article"}
    max_length: 130
  - name: target_id
    type: text
    label: {de: Kennung des Datensatzes, en: Id of the record}
    max_length: 36
  - name: url
    type: text
    label: {de: Adresse, en: Address}
    description: {de: "Beginnt mit https:// oder http://; öffnet sich in einem neuen Fenster", en: "Starts with https:// or http://; opens in a new window"}
    max_length: 2000
  - name: position
    type: number
    label: {de: Reihenfolge, en: Order}
    default: 100
  - name: audience
    type: choice
    label: {de: Sichtbar für, en: Visible to}
    required: true
    default: all
    options:
      - {value: all, label: {de: "Alle an diesem Ort und darunter", en: "Everyone at this place and below"}}
      - {value: groups, label: {de: Nur bestimmte Gruppen, en: Certain groups only}}
  - name: active
    type: boolean
    label: {de: Im Portal gezeigt, en: Shown in the portal}
    required: true
    default: true
actors:
  - name: shared
    label: {de: Gruppen, en: Groups}
    to: [core.group]
# Only the field the kind needs (SD-Plan E13).
field_states:
  - when: record.kind == "form"
    required: [form]
    hidden: [target_type, target_id, url]
  - when: record.kind == "create" || record.kind == "area"
    required: [target_type]
    hidden: [form, target_id, url]
  - when: record.kind == "record"
    required: [target_type, target_id]
    hidden: [form, url]
  - when: record.kind == "link"
    required: [url]
    hidden: [form, target_type, target_id]
# Who sees it in the portal: as at the article (SD-Plan E8, N12).
readers:
  - when: record.active == true && record.audience == "all"
  - when: record.active == true && record.audience == "groups"
    roles: [shared]
