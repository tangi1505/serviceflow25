#
# A group of persons (PL7; Inventar G118): a tree through parent, with a responsible person
# and a purpose. Members are records of core.group_member; the API answers the members of a
# group with or without its subgroups (/api/v1/groups/{id}/members).
name: group
label: {de: Gruppe, en: Group}
title_field: name
traits: [history]
fields:
  - name: name
    type: text
    label: {de: Name, en: Name}
    required: true
    searchable: true
    max_length: 200
  - name: purpose
    type: text
    label: {de: Zweck, en: Purpose}
    max_length: 2000
  - name: parent
    type: reference
    label: {de: Übergeordnete Gruppe, en: Parent group}
    to: core.group
  - name: responsible
    type: reference
    label: {de: Verantwortliche Person, en: Responsible person}
    to: core.person
  - name: active
    type: boolean
    label: {de: Aktiv, en: Active}
    default: true
