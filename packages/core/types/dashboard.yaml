#
# A dashboard (UI13, UI-Plan E39; Inventar G238, G239): a page of widgets with the filters
# period and unit on top. Its widgets are records of core.dashboard_widget. It is shared like a
# saved search, through the role "shared" with persons and groups; whoever looks at it sees the
# numbers of the records they may read themselves. Packages bring dashboards as start data.
name: dashboard
label: {de: Dashboard, en: Dashboard}
title_field: name
traits: [history, actors]
fields:
  - name: name
    type: text
    label: {de: Name, en: Name}
    required: true
    searchable: true
    translatable: true
    max_length: 100
  - name: description
    type: text
    label: {de: Beschreibung, en: Description}
    translatable: true
    max_length: 500
  # The period the dashboard opens with (PL65, Hauptplan E195). A new one starts with 7 days;
  # one from before without a value shows "Gesamt" as before. The person's last choice wins.
  - name: period
    type: choice
    label: {de: Zeitraum beim Öffnen, en: Period when opened}
    default: days_7
    options:
      - {value: all, label: {de: Gesamt, en: All}}
      - {value: today, label: {de: Heute, en: Today}}
      - {value: days_7, label: {de: 7 Tage, en: 7 days}}
      - {value: days_30, label: {de: 30 Tage, en: 30 days}}
      - {value: year, label: {de: Dieses Jahr, en: This year}}
actors:
  - name: shared
    label: {de: Geteilt mit, en: Shared with}
    to: [core.person, core.group]
