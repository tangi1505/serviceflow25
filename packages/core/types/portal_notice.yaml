#
# A notice in the portal under "Aktuell" (SD5, SD-Plan N3): the records of a type that meet a
# condition, each shown with one of its text fields, its state and since when. Whoever is
# signed in sees the active notices of the tenant; the records behind them stay unreadable
# otherwise. The package incident brings one for the open major incidents.
name: portal_notice
label: {de: Hinweis im Portal, en: Notice in the portal}
title_field: name
traits: [history]
fields:
  - name: name
    type: text
    label: {de: Name, en: Name}
    required: true
    unique: true
    searchable: true
    max_length: 100
  - name: target_type
    type: text
    label: {de: Für Typ, en: For type}
    description: {de: "Typ mit Paket, etwa incident.incident", en: "Type with its package, e.g. incident.incident"}
    required: true
    max_length: 130
  - name: query
    type: text
    label: {de: Bedingung, en: Condition}
    description: {de: "where der JSON-Abfrage, leer für alle", en: "where of the JSON query, empty for all"}
    max_length: 20000
  - name: text_field
    type: text
    label: {de: Textfeld, en: Text field}
    description: {de: "Feld des Typs, das im Portal steht, etwa public_note", en: "Field of the type shown in the portal, e.g. public_note"}
    required: true
    max_length: 63
  - name: active
    type: boolean
    label: {de: Im Portal gezeigt, en: Shown in the portal}
    required: true
    default: true
