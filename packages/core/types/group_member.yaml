#
# Membership of a person in a group (PL7): one record per pair. Roles on records (requester,
# watcher, assignee) come with WF3 and point at persons or groups.
name: group_member
label: {de: Gruppenmitglied, en: Group member}
traits: [history]
# A person is a member of a group once (PL57): a second membership made every right through the
# group count twice in the rights filter.
indexes:
  - fields: [group, person]
    unique: true
fields:
  - name: group
    type: reference
    label: {de: Gruppe, en: Group}
    to: core.group
    required: true
  - name: person
    type: reference
    label: {de: Person, en: Person}
    to: core.person
    required: true
