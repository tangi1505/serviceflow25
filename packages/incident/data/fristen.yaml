    target_minutes: 6600
    calendar: "@sd.servicezeit"
    applies: record.priority == 4
    pause: record.state == "waiting"
    stop: record.state in ["resolved", "closed"]

# Escalation at 80 % of each deadline to the lead of the assigned group (WF10, N10).
- key: escalate_p1_reaction
  rule:
    label: {de: Störung P1 Reaktion zu 80 %, en: Incident P1 reaction at 80 %}
    type_name: incident.incident
    trigger: clock
    mode: after
    sla: "@sla_p1_reaction"
    percent: 80
    actions:
      - notify: {to: [actors.group.responsible], message: "80 % der Reaktionsfrist (P1) sind verbraucht."}
- key: escalate_p1_solution
  rule:
    label: {de: Störung P1 Lösung zu 80 %, en: Incident P1 solution at 80 %}
    type_name: incident.incident
    trigger: clock
    mode: after
    sla: "@sla_p1_solution"
    percent: 80
    actions:
