# The deadlines of an incident (SD3, SD-Plan §2.4, E3, E6), provisional until the customer answers
# Hauptplan V31: reaction and solution per priority, in the service time of the package sd; P1
# round the clock (V31, Beta). The reaction is met once the incident leaves "new"; every wait
# holds the clock of the solution. At 80 % the responsible person of the assigned group hears of
# it (N10). A day of the service time has 11 hours (660 minutes).
- key: sla_p1_reaction
  type: core.sla
  values:
    name: Störung P1 Reaktion
    target_type: incident.incident
    target_minutes: 15
    counts: round_the_clock
    applies: record.priority == 1
    stop: record.state != "new"
- key: sla_p1_solution
  type: core.sla
  values:
    name: Störung P1 Lösung
    target_type: incident.incident
    target_minutes: 240
    counts: round_the_clock
    applies: record.priority == 1
    pause: record.state == "waiting"
    stop: record.state in ["resolved", "closed"]
- key: sla_p2_reaction
  type: core.sla
  values:
    name: Störung P2 Reaktion
    target_type: incident.incident
    target_minutes: 30
    calendar: "@sd.servicezeit"
    applies: record.priority == 2
    stop: record.state != "new"
- key: sla_p2_solution
  type: core.sla
  values:
    name: Störung P2 Lösung
    target_type: incident.incident
    target_minutes: 480
    calendar: "@sd.servicezeit"
    applies: record.priority == 2
    pause: record.state == "waiting"
    stop: record.state in ["resolved", "closed"]
- key: sla_p3_reaction
  type: core.sla
  values:
    name: Störung P3 Reaktion
    target_type: incident.incident
    target_minutes: 240
    calendar: "@sd.servicezeit"
    applies: record.priority == 3
    stop: record.state != "new"
- key: sla_p3_solution
  type: core.sla
  values:
    name: Störung P3 Lösung
    target_type: incident.incident
