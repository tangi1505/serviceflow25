# Closed by itself five days of the service time after "resolved", if the requester neither
# confirms nor refuses (WF12); a reopened incident starts anew.
- key: sla_close
  type: core.sla
  values:
    name: Störung automatisch schließen
    target_type: incident.incident
    target_minutes: 3300
    calendar: "@sd.servicezeit"
    start_from: applies
    applies: record.state == "resolved"
    stop: "false"
- key: close_resolved
  rule:
    label: {de: Gelöste Störung schließen, en: Close a resolved incident}
    type_name: incident.incident
    trigger: clock
    mode: after
    sla: "@sla_close"
    percent: 100
    actions:
      - transition: {name: close}
