#
# Störung (SD2; Inventar G36, G38, G42; IP19). The values of the priority matrix are
# provisional (SD-Plan E3, §2.4) until the business side answers Hauptplan V30; since SD20 they
# are the setting incident.priority_matrix, which a unit can set otherwise.
name: incident
label: {de: Störung, en: Incident}
description:
  de: Eine Störung eines Dienstes oder Arbeitsplatzes.
  en: A disruption of a service or a workplace.
title_field: title
# ticket from sd brings title, description, category, channel, impact, urgency and the roles
# requester, observer, assignee and group (SD-Plan N6, N7).
# resolution keeps when it was resolved and how long it took (UI14a).
traits: [sd.ticket, history, documents, timeline, resolution]
# The queues list open tickets, newest first (PL54, found with H14): an index on state and the
# moment of creation; the core indexes created_at alone for every type.
indexes:
  - fields: [state, created_at]
fields:
  # The running number per tenant (PL49): INC-1, INC-2, …
  - name: number
    type: sequence
    label: {de: Nummer, en: Number}
    prefix: INC-
  # Calculated (PL22) from the matrix of the record's unit (setting incident.priority_matrix,
  # SD20; default SD-Plan §2.4): P1 is the most urgent; empty until both impact and urgency are
  # set.
  - name: priority
    type: number
    label: {de: Priorität, en: Priority}
    format: priority
    formula: setting("incident.priority_matrix")[impact][urgency]
  - name: solution
    type: text
    label: {de: Lösung, en: Solution}
    format: rich
    snippets: solution
    searchable: true
  - name: solution_kind
    type: reference
    label: {de: Lösungsart, en: Kind of solution}
    to: sd.solution_kind
  # Why it waits (WF11); later the clocks pause by it (SD3).
  - name: wait_reason
    type: reference
    label: {de: Wartegrund, en: Reason to wait}
    to: core.wait_reason
  # A major incident (SD5, SD-Plan N3): declared by its transition, with a message for the
  # users that the portal shows under "Aktuell" as long as it is open.
  - name: major
    type: boolean
    label: {de: Major Incident, en: Major incident}
    default: false
  - name: public_note
    type: text
    label: {de: Mitteilung an Anwender, en: Message to the users}
    description:
      de: Steht im Portal unter „Aktuell“, solange der Major Incident offen ist.
      en: Shown in the portal under "Aktuell" while the major incident is open.
    max_length: 1000
  # A phone or on-site note asks for a callback (SD9); a rule of the start data makes it a
  # task of the one who took the note.
  - name: callback
    type: boolean
    label: {de: Rückruf erbeten, en: Callback requested}
    default: false
  # The open tasks of the incident (SD9, WF13).
  - name: tasks_open
    type: number
    label: {de: Offene Aufgaben, en: Open tasks}
    rollup: {from: incident.task, via: incident, op: count, where: record.state == "open"}
states:
  - {name: new, label: {de: Neu, en: New}, initial: true, category: open}
  - {name: in_progress, label: {de: In Arbeit, en: In progress}, category: active}
  - {name: waiting, label: {de: Wartet, en: Waiting}, category: waiting}
  - {name: resolved, label: {de: Gelöst, en: Resolved}, category: done}
  - {name: closed, label: {de: Geschlossen, en: Closed}, category: done}
transitions:
  - {name: start, label: {de: Beginnen, en: Start}, from: [new], to: in_progress}
  - {name: wait, label: {de: Warten, en: Wait}, from: [in_progress], to: waiting}
  - {name: resume, label: {de: Fortsetzen, en: Resume}, from: [waiting], to: in_progress}
  - {name: resolve, label: {de: Lösen, en: Resolve}, from: [new, in_progress, waiting], to: resolved}
  # Declaring a major incident (SD5): with its reason as an entry, and the message to the users
  # set before; the rules of the start data tell the distribution list.
  - name: declare_major
    label: {de: Zum Major Incident erklären, en: Declare a major incident}
    from: [new, in_progress, waiting]
    to: in_progress
    comment: required
    set: {major: true}
  # Reopened only from resolved; closed is final (SD-Plan E5).
  - {name: reopen, label: {de: Wieder öffnen, en: Reopen}, from: [resolved], to: in_progress}
  - {name: close, label: {de: Schließen, en: Close}, from: [resolved], to: closed}
  # The requester confirms or refuses the solution, also in the portal (SD-Plan E5, N8); a
  # refusal needs its reason, kept as an entry at the record.
  - name: confirm
    label: {de: Lösung bestätigen, en: Confirm the solution}
    from: [resolved]
    to: closed
    by: [requester]
  - name: refuse
    label: {de: Lösung ablehnen, en: Refuse the solution}
    from: [resolved]
    to: in_progress
    by: [requester]
    comment: required
field_states:
  # A resolved incident needs its solution and how it was solved; a closed one changes no
  # more (SD-Plan E5).
  - states: [resolved, closed]
    required: [solution, solution_kind]
  - states: [waiting]
    required: [wait_reason]
  - when: record.major == true
    required: [public_note]
  - states: [closed]
    read_only: ["*"]
# In the portal (UI10): a person reports with title, description and category, and answers.
portal:
  fields: [title, description, category]
