# The calendar of the service time (SD3, SD-Plan §2.4, E3, E6): Monday to Friday 7 to 18 o'clock,
# without the holidays of all of Germany in 2026 and 2027. Provisional until the customer answers
# Hauptplan V31; the holidays of a federal state and later years the customer adds.
- key: servicezeit
  type: core.calendar
  values:
    name: Servicezeit
    timezone: Europe/Berlin
    description: Servicezeit des Service Desks, Montag bis Freitag 7 bis 18 Uhr (vorläufig).
