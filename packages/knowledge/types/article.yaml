#
# An article (SD16a; Inventar G106): a title and formatted text under a category of the tree of
# the base package sd. Who reads it says "Sichtbar für" (SD-Plan E8): everyone, also in the
# portal, once it is published, from the article's node of the organisation tree downwards;
# only agents, whom their roles let read; or only the groups named in the role "Gruppen". From
# the day after "Gültig bis" it is gone from the portal; a daily rule sets it expired and writes
# to its author (SD16d, data/ablauf.yaml). Title
# and text may carry an English translation (SD16c); the form edits the German one, readers see
# their language where there is one (SD-Plan E10). While a ticket is written it is suggested,
# in the portal beside the form and in the tab "Wissen" of the ticket; readers say whether it
# helped and comment on it in its timeline (SD18, SD-Plan E12).
name: article
label: {de: Artikel, en: Article}
title_field: title
traits: [history, actors, timeline, rating]
fields:
  - name: title
    type: text
    label: {de: Titel, en: Title}
    required: true
    searchable: true
    translatable: true
    max_length: 200
  - name: body
    type: text
    label: {de: Text, en: Text}
    format: rich
    required: true
    searchable: true
    translatable: true
  - name: category
    type: reference
    label: {de: Kategorie, en: Category}
    to: sd.category
  - name: audience
    type: choice
    label: {de: Sichtbar für, en: Visible to}
    required: true
    default: agents
    options:
      - {value: all, label: {de: "Alle, auch im Portal", en: "Everyone, also in the portal"}}
      - {value: agents, label: {de: Nur Bearbeiter, en: Agents only}}
      - {value: groups, label: {de: Nur bestimmte Gruppen, en: Certain groups only}}
  - name: expires_on
    type: date
    label: {de: Gültig bis, en: Valid until}
actors:
  # Who creates the article, unless the form names another (SD16d); gets the reminder before
  # it expires and the mail when it has.
  - name: author
    label: {de: Autor, en: Author}
    to: [core.person]
    single: true
  - name: shared
    label: {de: Gruppen, en: Groups}
    to: [core.group]
states:
  - {name: draft, label: {de: Entwurf, en: Draft}, initial: true, category: open}
  - {name: published, label: {de: Veröffentlicht, en: Published}, category: active}
  - {name: expired, label: {de: Abgelaufen, en: Expired}, category: done}
transitions:
  - {name: publish, label: {de: Veröffentlichen, en: Publish}, from: [draft, expired], to: published}
  - {name: expire, label: {de: Ablaufen lassen, en: Expire}, from: [published], to: expired}
  - {name: revise, label: {de: Zurück in den Entwurf, en: Back to draft}, from: [published, expired], to: draft}
# Who reads without a role (SD-Plan E8, N12): a published article for everyone at its node and
# below, one for some groups their members wherever they are; without groups only agents read
# it. Agents read by their roles. Valid until yesterday it is gone, before the nightly rule.
# Who reads it may comment on it (SD18).
readers:
  - when: record.state == "published" && record.audience == "all" && (record.expires_on == null || record.expires_on >= today())
    actions: [read, comment]
  - when: record.state == "published" && record.audience == "groups" && (record.expires_on == null || record.expires_on >= today())
    roles: [shared]
    actions: [read, comment]
# Suggested for every ticket by its title and description (SD18, SD-Plan E12): "Verknüpfen"
# links with uses, "Als Lösung übernehmen" sets the text and the kind "Anleitung gegeben".
suggest:
  label: {de: Wissen, en: Knowledge}
  for: ["trait:sd.ticket"]
  from: [title, description]
  relation: knowledge.uses
  apply:
    label: {de: Als Lösung übernehmen, en: Use as solution}
    set:
      solution: "@body"
      solution_kind: instructed
# The area "Wissen" in the head of the portal (SD16a, variant B of the mockup).
portal:
  read:
    label: {de: Wissen, en: Knowledge}
    fields: [category, body]
    group: category
