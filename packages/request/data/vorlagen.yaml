# The templates of the fulfilment at work (SD6, SD-Plan E14, N17, N18): a request that names a
# template asks for approval in its stages; once it goes "In Erfüllung" it gets one task per
# line, for the group of the line. All of it is start data each tenant changes.

# Asking: when the request is made with a template, or a new one gets one.
- key: genehmigung_beim_anlegen
  rule:
    label: {de: Genehmigung aus der Vorlage beim Anlegen, en: Approval from the template on creating}
    type_name: request.request
    trigger: create
    mode: after
    condition: has(record.template) && record.template != null
    actions:
      - approval:
          stages: {type_name: request.template_stage, match: {template: template}, order: position}
          name: name
          need: need
          approvers: approvers
          message: Bitte genehmigen Sie diese Anfrage.
- key: genehmigung_bei_vorlage
  rule:
    label: {de: Genehmigung aus der Vorlage bei neuer Vorlage, en: Approval from the template when it is set}
    type_name: request.request
    trigger: update
    mode: after
    condition: '"template" in changed && record.state == "new" && has(record.template) && record.template != null'
    actions:
      - approval:
          stages: {type_name: request.template_stage, match: {template: template}, order: position}
          name: name
          need: need
          approvers: approvers
          message: Bitte genehmigen Sie diese Anfrage.
# The fulfilment: once, when the request is in fulfilment and has no task yet.
- key: aufgaben_aus_vorlage
  rule:
    label: {de: Aufgaben aus der Vorlage, en: Tasks from the template}
    type_name: request.request
    trigger: update
    mode: after
    condition: record.state == "fulfilment" && record.tasks_total == 0 && has(record.template) && record.template != null
    actions:
      - create:
          type_name: request.task
          each: {type_name: request.template_task, match: {template: template}, order: position}
          fields:
            request: "@record"
            title: "@item.title"
            description: "@item.description"
            position: "@item.position"
            actors: {assignee: [{type: core.group, id: "@item.group"}]}

# An example to start from: tasks only; the stages and their approvers the tenant adds.
- key: arbeitsplatz
  type: request.template
  values:
    name: Neuer Arbeitsplatz
    description: Gerät bereitstellen und Zugänge einrichten.
    active: true
- key: arbeitsplatz_geraet
  type: request.template_task
  values:
    template: "@arbeitsplatz"
    title: Gerät bereitstellen
    group: "@sd.service_desk"
    position: 10
- key: arbeitsplatz_zugaenge
  type: request.template_task
  values:
    template: "@arbeitsplatz"
    title: Zugänge einrichten
    group: "@sd.service_desk"
    position: 20
