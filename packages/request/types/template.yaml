#
# A template of the fulfilment (SD6; SD-Plan E14): the template of the approval
# (core.approval_template, since WF7 instead of own stages) and the tasks of the fulfilment
# (request.template_task) a request gets when it names the template. The catalog (SD13) names
# a template per offer.
name: template
label: {de: Erfüllungsvorlage, en: Fulfilment template}
title_field: name
traits: [history]
fields:
  - name: name
    type: text
    label: {de: Name, en: Name}
    required: true
    searchable: true
    translatable: true
    max_length: 200
  - name: description
    type: text
    label: {de: Beschreibung, en: Description}
    translatable: true
    max_length: 2000
  # The approval a request with this template asks for (WF7, WF-Plan E18); empty: none.
  - name: approval_template
    type: reference
    label: {de: Genehmigungsvorlage, en: Approval template}
    description:
      de: Nennt eine Anfrage diese Erfüllungsvorlage, fordert die Regel der Startdaten die Genehmigung nach dieser Vorlage an.
      en: When a request names this fulfilment template, the rule of the start data asks for approval from this template.
    to: core.approval_template
  - name: active
    type: boolean
    label: {de: Aktiv, en: Active}
    required: true
    default: true
