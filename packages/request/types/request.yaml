#
# Anfrage (SD6; SD-Plan E14; Inventar G36; IP30): something a person asks for. Its template
# (request.template) names the stages of the approval, asked as soon as the request has one,
# and the tasks of the fulfilment, made when it goes "In Erfüllung". Without a template the
# service desk asks for approval by hand, or starts the fulfilment at once.
name: request
label: {de: Anfrage, en: Request}
description:
  de: Etwas, das eine Person braucht, etwa ein Zugang oder ein Gerät.
  en: Something a person needs, such as an access or a device.
title_field: title
# ticket from sd brings title, description, category, channel, impact, urgency and the roles
# requester, observer, assignee and group (SD-Plan N6, N7).
traits: [sd.ticket, history, documents, timeline, approvals]
fields:
  # The running number per tenant (PL49): REQ-1, REQ-2, …
  - name: number
    type: sequence
    label: {de: Nummer, en: Number}
    prefix: REQ-
  - name: template
    type: reference
    label: {de: Erfüllungsvorlage, en: Fulfilment template}
    description:
      de: Nennt die Stufen der Genehmigung und die Aufgaben der Erfüllung.
      en: Names the stages of the approval and the tasks of the fulfilment.
    to: request.template
  # What an offer of the catalog hands on when it is ordered (SD13, SD-Plan E15): the delivery
  # time sets the deadline of the fulfilment, the costs are shown only, nothing is charged.
  - name: delivery_days
    type: number
    label: {de: Lieferzeit in Arbeitstagen, en: Delivery time in working days}
    description:
      de: Die Frist der Erfüllung; vom Angebot, ohne Angebot fünf Tage.
      en: The deadline of the fulfilment; from the offer, without one five days.
    default: 5
    min: 0
  - name: cost
    type: number
    label: {de: Kosten in Euro, en: Costs in euros}
    min: 0
  - name: cost_kind
    type: choice
    label: {de: Kostenart, en: Kind of costs}
    options:
      - {value: once, label: {de: einmalig, en: once}}
      - {value: monthly, label: {de: monatlich, en: monthly}}
      - {value: yearly, label: {de: jährlich, en: yearly}}
  - name: solution
    type: text
    label: {de: Lösung, en: Solution}
    format: rich
    snippets: solution
    searchable: true
  - name: solution_kind
    type: reference
    label: {de: Lösungsart, en: Kind of solution}
    to: sd.solution_kind
  - name: wait_reason
    type: reference
    label: {de: Wartegrund, en: Reason to wait}
    to: core.wait_reason
  # The tasks of the fulfilment (WF13): the open ones, and all, so that a rule makes them once.
  - name: tasks_open
    type: number
    label: {de: Offene Aufgaben, en: Open tasks}
    rollup: {from: request.task, via: request, op: count, where: record.state == "open"}
  - name: tasks_total
    type: number
    label: {de: Aufgaben, en: Tasks}
    rollup: {from: request.task, via: request, op: count}
states:
  - {name: new, label: {de: Neu, en: New}, initial: true, category: open}
  - {name: approval, label: {de: Wartet auf Genehmigung, en: Awaiting approval}, category: waiting}
  - {name: fulfilment, label: {de: In Erfüllung, en: In fulfilment}, category: active}
  - {name: waiting, label: {de: Wartet, en: Waiting}, category: waiting}
  - {name: done, label: {de: Erledigt, en: Done}, category: done}
  - {name: closed, label: {de: Geschlossen, en: Closed}, category: done}
  - {name: rejected, label: {de: Abgelehnt, en: Rejected}, category: done}
transitions:
  - {name: start, label: {de: Erfüllung beginnen, en: Start the fulfilment}, from: [new], to: fulfilment}
  # The approval moves the request (WF6): asked, given, refused with its reason as an entry.
  - name: ask
    label: {de: Genehmigung angefordert, en: Approval asked}
    from: [new]
    to: approval
    when: record.approval == "pending"
  - name: grant
    label: {de: Genehmigt, en: Approved}
    from: [approval]
    to: fulfilment
    when: record.approval == "approved"
  - name: refuse
    label: {de: Abgelehnt, en: Rejected}
    from: [approval]
    to: rejected
    comment: required
    when: record.approval == "rejected"
  # After an approval was withdrawn the request goes back to new.
  - name: withdrawn
    label: {de: Zurück zu Neu, en: Back to new}
    from: [approval]
    to: new
    when: record.approval == "withdrawn"
  - {name: wait, label: {de: Warten, en: Wait}, from: [fulfilment], to: waiting}
  - {name: resume, label: {de: Fortsetzen, en: Resume}, from: [waiting], to: fulfilment}
  - {name: complete, label: {de: Erledigen, en: Complete}, from: [fulfilment, waiting], to: done}
  - {name: reopen, label: {de: Wieder öffnen, en: Reopen}, from: [done], to: fulfilment}
  - {name: close, label: {de: Schließen, en: Close}, from: [done], to: closed}
  # The requester confirms in the portal (as with the incident, SD-Plan N8).
  - name: confirm
    label: {de: Erledigung bestätigen, en: Confirm}
    from: [done]
    to: closed
    by: [requester]
approval:
  requested: ask
  approved: grant
  rejected: refuse
field_states:
  - states: [waiting]
    required: [wait_reason]
  - states: [closed, rejected]
    read_only: ["*"]
# In the portal (UI10): a person asks with title, description and category, and answers.
portal:
  fields: [title, description, category]
